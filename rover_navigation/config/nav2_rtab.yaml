# RPP: straight 0.35 m/s; continuous curvature scaling to 0.25 m/s; cap 0.4 m/s.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # RGB-D/RViz load on Jetson can delay action acknowledgements beyond 20 ms.
    bt_loop_duration: 50
    default_server_timeout: 1000
    default_nav_through_poses_bt_xml: ackermann_through_poses_bt
    default_nav_to_pose_bt_xml: ackermann_to_pose_bt
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 1.5
      min_lookahead_dist: 1.0
      max_lookahead_dist: 2.5
      lookahead_time: 2.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.2
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 3.0
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 1.0
      downsample_costmap: false
      allow_unknown: false
      # Humble maps <= 0 to its unlimited-search sentinel (INT_MAX).
      max_iterations: -1
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      # Humble treats zero as immediate timeout; effectively disable wall-time cutoff.
      # An unreachable goal can still exhaust the search; this is not a deadline.
      max_planning_time: 1000000000.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 10.0
      # Plan wider than the adapter's 1.7 m corrective steering envelope.
      minimum_turning_radius: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smooth_path: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[[0.41, 0.135], [0.41, -0.135], [-0.07, -0.135], [-0.07, 0.135]]'
      track_unknown_space: true
      plugins:
      - static_layer
      - route_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
      # 15 cm requested clearance + 5 cm grid margin around the physical body.
      footprint_padding: 0.20
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      route_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/route_map
        map_subscribe_transient_local: true
        enabled: true
      use_maximum: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05
      footprint: '[[0.41, 0.135], [0.41, -0.135], [-0.07, -0.135], [-0.07, 0.135]]'
      track_unknown_space: true
      plugins:
      - static_layer
      - route_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
      footprint_padding: 0.20
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      route_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/route_map
        map_subscribe_transient_local: true
        enabled: true
      use_maximum: false
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.4
    - 0.0
    - 0.36
    min_velocity:
    - 0.0
    - 0.0
    - -0.36
    max_accel:
    - 0.5
    - 0.0
    - 0.5
    max_decel:
    - -0.8
    - 0.0
    - -0.8
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
localization_guard:
  ros__parameters:
    # Explicit VO loss/invalid data stops immediately; active goals latch until acknowledgement.
    strict_tracking_safety: true
    tracking_max_age_s: 2.5
    # Deprecated compatibility parameter; neither RTAB event topic is a heartbeat.
    localization_timeout_s: 2.0
    # Callback receipt deadline: ~3 Hz odometry has measured gaps up to 0.57 s.
    # tracking_max_age_s separately bounds sensor processing age.
    # map->odom retains its separate RTAB 20 Hz broadcaster watchdog.
    odometry_timeout_s: 1.0
    maximum_position_variance_m2: 0.25
    maximum_yaw_variance_rad2: 0.12
    stable_duration_s: 3.0
    path_timeout_s: 4.0
