name: ROS 2 build and tests
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ros2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '87'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src
      - name: Install declared dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pytest python3-pip
          rosdep update --rosdistro humble
          rosdep install --from-paths ws/src --ignore-src --rosdistro humble -r -y
      - name: Build
        working-directory: ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
      - name: Test without hardware
        working-directory: ws
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Test mission ROS bridge in an isolated domain
        if: hashFiles('ws/src/apps/campus_mission/pyproject.toml') != ''
        run: |
          apt-get install -y python3-venv
          python3 -m venv --system-site-packages /tmp/mission-tests
          /tmp/mission-tests/bin/pip install './ws/src/apps/campus_mission[test]'
          source /opt/ros/humble/setup.bash
          source ws/install/setup.bash
          ROS_DOMAIN_ID=91 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 /tmp/mission-tests/bin/python -m pytest \
            ws/src/apps/campus_mission/tests/test_ros_bridge.py -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humble-test-results
          path: |
            ws/build/**/test_results/**
            ws/build/**/pytest.xml
            ws/log/latest_test/**
          retention-days: 7
