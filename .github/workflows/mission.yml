name: Mission service and dashboard
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install application and test dependencies
        run: python -m pip install './apps/campus_mission[test]'
      - name: Test mission lifecycle, preparation and storage tools
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest apps/campus_mission/tests --ignore=apps/campus_mission/tests/test_ros_bridge.py tools/storage/test_migrate_home.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/campus_mission/web/package-lock.json
      - name: Verify reproducible dashboard bundle
        working-directory: apps/campus_mission/web
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist/
